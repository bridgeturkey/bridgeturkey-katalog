<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#12345a"><meta name="description" content="BridgeTurkey firma kataloğu: Türkiye'den firmaları arayın ve sektörlere göre filtreleyin.">
<link rel="manifest" href="manifest.webmanifest"><title>BridgeTurkey | Firma Kataloğu</title>
<style>
:root{--navy:#12345a;--blue:#1e5b91;--gold:#e3b34b;--bg:#f3f6fa;--ink:#17283c;--muted:#617184}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}
header{background:linear-gradient(130deg,#102a49,#1c5b88);color:white;padding:26px 18px 22px}
.wrap{max-width:980px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:1.45rem;font-weight:850;letter-spacing:.2px}.brand span{color:var(--gold)}button,select,input{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;font-weight:700}.lang{background:white;color:var(--navy)}.top-actions{display:flex;align-items:center;gap:8px}.join{display:inline-block;background:var(--gold);color:#102a49;text-decoration:none;padding:10px 13px;border-radius:10px;font-weight:800;font-size:.9rem;white-space:nowrap}.company-image{display:block;width:100%;height:180px;object-fit:cover;border-radius:11px;margin:0 0 14px;background:#e9eef5}.card h1{font-size:clamp(1.5rem,5vw,2.4rem);margin:22px 0 6px}header p{margin:0;color:#e1eaf3}
main{padding:20px 16px 42px}.filters{display:grid;grid-template-columns:1fr;gap:10px;background:white;padding:14px;border-radius:16px;box-shadow:0 5px 22px #1936530d;margin-bottom:16px}
input,select{width:100%;border:1px solid #d5deea;border-radius:10px;padding:12px;background:#fff;color:var(--ink)}.count{font-size:.9rem;color:var(--muted);margin:12px 2px}.cards{display:grid;grid-template-columns:1fr;gap:12px}.card{background:white;border:1px solid #e2e8f0;border-radius:16px;padding:16px;box-shadow:0 3px 12px #19365308}.card h2{font-size:1.1rem;margin:0 0 8px}.tag{display:inline-block;background:#eaf2fa;color:#1e527e;border-radius:999px;padding:5px 9px;font-size:.78rem;font-weight:700;margin-bottom:8px}.meta{font-size:.9rem;color:var(--muted);margin:4px 0}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.actions a{display:inline-block;text-decoration:none;background:var(--navy);color:white;padding:9px 11px;border-radius:9px;font-size:.88rem;font-weight:700}.actions a.secondary{background:#e9eef5;color:var(--navy)}.note{font-size:.8rem;color:#7a5a1a;margin-top:12px}.empty{padding:30px;text-align:center;color:var(--muted);background:white;border-radius:14px}
footer{text-align:center;color:var(--muted);font-size:.85rem;padding:0 16px 28px}footer a{color:var(--blue)}
@media(min-width:620px){.filters{grid-template-columns:2fr 1fr}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(min-width:900px){.cards{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style></head><body>
<header><div class="wrap"><div class="top"><div class="brand">Bridge<span>Turkey</span></div><div class="top-actions"><a class="join" id="join" href="https://docs.google.com/forms/d/e/1FAIpQLSfQxSQW67GSnNJP_vrsKEE7VY82rky_QC4HC2o0McP_nXTQGQ/viewform" target="_blank" rel="noopener noreferrer">Üye Ol</a><button class="lang" id="lang">EN</button></div></div><h1 id="headline">Türk firmalarını keşfedin</h1><p id="subtitle">Arayın, sektörlere göre filtreleyin ve firmalarla bağlantı kurun.</p></div></header>
<main class="wrap"><div class="filters"><input id="q" type="search" placeholder="Firma, ürün veya şehir ara…"><select id="sector"><option value="">Tüm sektörler</option></select></div><div class="count" id="count"></div><div class="cards" id="cards"></div></main>
<footer><p id="footnote">Bu katalog BridgeTurkey sitesindeki firma listelerinden oluşturulmuş ilk taslaktır. Yayınlamadan önce firma bilgileri doğrulanmalıdır.</p><a href="https://bridgeturkey.rs/firme/" target="_blank" rel="noopener">BridgeTurkey web sitesi</a></footer>
<script>
const TR={join:"Üye Ol",headline:"Türk firmalarını keşfedin",subtitle:"Arayın, sektörlere göre filtreleyin ve firmalarla bağlantı kurun.",search:"Firma, ürün veya şehir ara…",all:"Tüm sektörler",count:n=>`${n} firma gösteriliyor`,location:"Konum",source:"Firma sayfası",review:"İletişim bilgileri doğrulanmalı.",footnote:"Bu katalog BridgeTurkey sitesindeki firma listelerinden oluşturulmuş ilk taslaktır. Yayınlamadan önce firma bilgileri doğrulanmalıdır.",empty:"Eşleşen firma bulunamadı.",call:"Ara",email:"E-posta",website:"Web sitesi",profile:"BridgeTurkey profili"};
const EN={join:"Join",headline:"Discover Turkish companies",subtitle:"Search, filter by industry and connect with companies.",search:"Search company, product or city…",all:"All industries",count:n=>`Showing ${n} companies`,location:"Location",source:"Company page",review:"Contact details need verification.",footnote:"This is an initial draft based on company listings on BridgeTurkey. Please verify company details before publishing.",empty:"No matching companies found.",call:"Call",email:"Email",website:"Website",profile:"BridgeTurkey profile"};
let lang="tr",firms=[];
const $=id=>document.getElementById(id);
fetch("firms.json").then(r=>r.json()).then(d=>{firms=d;populateSectors();render()}).catch(()=>{$("cards").innerHTML='<div class="empty">Could not load firms.json.</div>'});
function tx(){return lang==="tr"?TR:EN}
function populateSectors(){const vals=[...new Set(firms.map(f=>lang==="tr"?f.sector:f.sector_en))].sort();$("sector").innerHTML=`<option value="">${tx().all}</option>`+vals.map(v=>`<option>${esc(v)}</option>`).join("")}
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function render(){const t=tx(),q=$("q").value.toLocaleLowerCase(lang==="tr"?"tr":"en"),s=$("sector").value;const arr=firms.filter(f=>(!s||(lang==="tr"?f.sector:f.sector_en)===s)&&[f.name,f.sector,f.sector_en,f.location].join(" ").toLocaleLowerCase(lang==="tr"?"tr":"en").includes(q));$("count").textContent=t.count(arr.length);$("cards").innerHTML=arr.length?arr.map(f=>`<article class="card">${f.image?`<img class="company-image" src="${esc(f.image)}" alt="${esc(f.name)}" loading="lazy" onerror="this.style.display='none'">`:""}<div class="tag">${esc(lang==="tr"?f.sector:f.sector_en)}</div><h2>${esc(f.name)}</h2><div class="meta">📍 ${esc(f.location||"—")}</div><div class="actions">${f.phone?`<a href="tel:${esc(f.phone)}">${t.call}</a>`:""}${f.email?`<a href="mailto:${esc(f.email)}">${t.email}</a>`:""}${f.website?`<a href="${esc(f.website)}" target="_blank" rel="noopener">${t.website}</a>`:""}<a class="secondary" href="${esc(f.profile)}" target="_blank" rel="noopener">${t.profile}</a></div><div class="note">${t.review}</div></article>`).join(""):`<div class="empty">${t.empty}</div>`;$("join").textContent=t.join;$("headline").textContent=t.headline;$("subtitle").textContent=t.subtitle;$("q").placeholder=t.search;$("footnote").textContent=t.footnote}
$("q").addEventListener("input",render);$("sector").addEventListener("change",render);$("lang").addEventListener("click",()=>{lang=lang==="tr"?"en":"tr";document.documentElement.lang=lang;$("lang").textContent=lang==="tr"?"EN":"TR";populateSectors();render()});
if("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
