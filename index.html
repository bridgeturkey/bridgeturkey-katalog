<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#12345a"><meta name="description" content="BridgeTurkey firma kataloğu: Türkiye'den firmaları arayın ve sektörlere göre filtreleyin.">
<link rel="manifest" href="manifest.webmanifest"><title>BridgeTurkey | Firma Kataloğu</title>
<style>
:root{--navy:#12345a;--blue:#1e5b91;--gold:#e3b34b;--bg:#f3f6fa;--ink:#17283c;--muted:#617184}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}
header{background:linear-gradient(130deg,#102a49,#1c5b88);color:white;padding:26px 18px 22px}
.wrap{max-width:980px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:1.45rem;font-weight:850;letter-spacing:.2px}.brand span{color:var(--gold)}button,select,input{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;font-weight:700}.lang{background:white;color:var(--navy)}h1{font-size:clamp(1.5rem,5vw,2.4rem);margin:22px 0 6px}header p{margin:0;color:#e1eaf3}
main{padding:20px 16px 42px}.filters{display:grid;grid-template-columns:1fr;gap:10px;background:white;padding:14px;border-radius:16px;box-shadow:0 5px 22px #1936530d;margin-bottom:16px}
input,select{width:100%;border:1px solid #d5deea;border-radius:10px;padding:12px;background:#fff;color:var(--ink)}.count{font-size:.9rem;color:var(--muted);margin:12px 2px}.cards{display:grid;grid-template-columns:1fr;gap:12px}.card{background:white;border:1px solid #e2e8f0;border-radius:16px;padding:16px;box-shadow:0 3px 12px #19365308}.card h2{font-size:1.1rem;margin:0 0 8px}.tag{display:inline-block;background:#eaf2fa;color:#1e527e;border-radius:999px;padding:5px 9px;font-size:.78rem;font-weight:700;margin-bottom:8px}.meta{font-size:.9rem;color:var(--muted);margin:4px 0}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.actions a{display:inline-block;text-decoration:none;background:var(--navy);color:white;padding:9px 11px;border-radius:9px;font-size:.88rem;font-weight:700}.actions a.secondary{background:#e9eef5;color:var(--navy)}.note{font-size:.8rem;color:#7a5a1a;margin-top:12px}.empty{padding:30px;text-align:center;color:var(--muted);background:white;border-radius:14px}
footer{text-align:center;color:var(--muted);font-size:.85rem;padding:0 16px 28px}footer a{color:var(--blue)}
@media(min-width:620px){.filters{grid-template-columns:2fr 1fr}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(min-width:900px){.cards{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style></head><body>
<header><div class="wrap"><div class="top"><div class="brand">Bridge<span>Turkey</span></div><button class="lang" id="lang" aria-label="Change language">EN</button></div><h1 id="headline">Türk firmalarını keşfedin</h1><p id="subtitle">Arayın, sektörlere göre filtreleyin ve firmalarla bağlantı kurun.</p></div></header>
<main class="wrap"><div class="filters"><input id="q" type="search" placeholder="Firma, ürün veya şehir ara…"><select id="sector"><option value="">Tüm sektörler</option></select></div><div class="count" id="count"></div><div class="cards" id="cards"></div></main>
<footer><p id="footnote">Bu katalog BridgeTurkey sitesindeki firma listelerinden oluşturulmuş ilk taslaktır. Yayınlamadan önce firma bilgileri doğrulanmalıdır.</p><a href="https://bridgeturkey.rs/firme/" target="_blank" rel="noopener">BridgeTurkey web sitesi</a></footer>
<script>
const LANGS = {
tr: {
headline:"Türk firmalarını keşfedin", subtitle:"Arayın, sektörlere göre filtreleyin ve firmalarla bağlantı kurun.",
search:"Firma, ürün veya şehir ara…", all:"Tüm sektörler", count:n=>`${n} firma gösteriliyor`,
review:"İletişim bilgileri doğrulanmalı.", footnote:"Bu katalog BridgeTurkey sitesindeki firma listelerinden oluşturulmuş ilk taslaktır. Yayınlamadan önce firma bilgileri doğrulanmalıdır.",
empty:"Eşleşen firma bulunamadı.", call:"Ara", email:"E-posta", website:"Web sitesi", profile:"BridgeTurkey profili"
},
en: {
headline:"Discover Turkish companies", subtitle:"Search, filter by industry and connect with companies.",
search:"Search company, product or city…", all:"All industries", count:n=>`Showing ${n} companies`,
review:"Contact details need verification.", footnote:"This is an initial draft based on company listings on BridgeTurkey. Please verify company details before publishing.",
empty:"No matching companies found.", call:"Call", email:"Email", website:"Website", profile:"BridgeTurkey profile"
},
sr: {
headline:"Otkrijte turske kompanije", subtitle:"Pretražujte kompanije, filtrirajte po delatnosti i povežite se sa njima.",
search:"Pretražite kompaniju, proizvod ili grad…", all:"Sve delatnosti", count:n=>`Prikazano kompanija: ${n}`,
review:"Potrebno je proveriti kontakt podatke.", footnote:"Ovaj katalog je početna verzija zasnovana na listama kompanija na sajtu BridgeTurkey. Proverite podatke pre objavljivanja.",
empty:"Nema rezultata pretrage.", call:"Pozovi", email:"E-pošta", website:"Veb-sajt", profile:"BridgeTurkey profil"
}
};
const LANG_ORDER=["tr","en","sr"];
let lang="tr",firms=[];
const $=id=>document.getElementById(id);
fetch("./firms.json").then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}).then(d=>{if(!Array.isArray(d))throw new Error("Invalid firms.json");firms=d;populateSectors();render()}).catch(()=>{$("cards").innerHTML='<div class="empty">Could not load firms.json. Please refresh the page.</div>'});
function tx(){return LANGS[lang]}
function sectorName(f){if(lang==="tr")return f.sector;if(lang==="en")return f.sector_en||f.sector;return f.sector_sr||f.sector_en||f.sector}
function populateSectors(){const vals=[...new Set(firms.map(sectorName))].sort();$("sector").innerHTML=`<option value="">${tx().all}</option>`+vals.map(v=>`<option>${esc(v)}</option>`).join("")}
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function render(){const t=tx(),q=$("q").value.toLocaleLowerCase(lang==="tr"?"tr":lang==="sr"?"sr":"en"),s=$("sector").value;const arr=firms.filter(f=>(!s||sectorName(f)===s)&&[f.name,f.sector,f.sector_en,f.sector_sr,f.location].join(" ").toLocaleLowerCase(lang==="tr"?"tr":lang==="sr"?"sr":"en").includes(q));$("count").textContent=t.count(arr.length);$("cards").innerHTML=arr.length?arr.map(f=>`<article class="card"><div class="tag">${esc(sectorName(f))}</div><h2>${esc(f.name)}</h2><div class="meta">📍 ${esc(f.location||"—")}</div><div class="actions">${f.phone?`<a href="tel:${esc(f.phone)}">${t.call}</a>`:""}${f.email?`<a href="mailto:${esc(f.email)}">${t.email}</a>`:""}${f.website?`<a href="${esc(f.website)}" target="_blank" rel="noopener">${t.website}</a>`:""}<a class="secondary" href="${esc(f.profile)}" target="_blank" rel="noopener">${t.profile}</a></div><div class="note">${t.review}</div></article>`).join(""):`<div class="empty">${t.empty}</div>`;$("headline").textContent=t.headline;$("subtitle").textContent=t.subtitle;$("q").placeholder=t.search;$("footnote").textContent=t.footnote;document.documentElement.lang=lang}
function nextLanguage(){lang=LANG_ORDER[(LANG_ORDER.indexOf(lang)+1)%LANG_ORDER.length];$("lang").textContent=lang==="tr"?"EN":lang==="en"?"SR":"TR";populateSectors();render()}
$("q").addEventListener("input",render);$("sector").addEventListener("change",render);$("lang").addEventListener("click",nextLanguage);
if("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
