<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#12345a"><meta name="description" content="BridgeTurkey firma kataloğu: Türkiye'den firmaları arayın ve sektörlere göre filtreleyin.">
<link rel="manifest" href="manifest.webmanifest"><title>BridgeTurkey | Firma Kataloğu</title>
<style>
:root{--navy:#12345a;--blue:#1e5b91;--gold:#e3b34b;--bg:#f3f6fa;--ink:#17283c;--muted:#617184;--line:#e2e8f0;--soft:#e9eef5}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}
header{background:linear-gradient(130deg,#102a49,#1c5b88);color:white;padding:24px 18px 25px}.wrap{max-width:1120px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:1.45rem;font-weight:850;letter-spacing:.2px}.brand span{color:var(--gold)}button,select,input{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;font-weight:700}.lang{background:white;color:var(--navy);min-width:52px}h1{font-size:clamp(1.55rem,4vw,2.4rem);margin:22px 0 6px;line-height:1.15}header p{margin:0;color:#e1eaf3;line-height:1.5}
main{padding:22px 16px 42px}.filters{display:grid;grid-template-columns:1fr;gap:10px;background:white;padding:14px;border-radius:16px;box-shadow:0 5px 22px #1936530d;margin-bottom:16px}input,select{width:100%;min-width:0;border:1px solid #d5deea;border-radius:10px;padding:12px;background:#fff;color:var(--ink)}.count{font-size:.9rem;color:var(--muted);margin:12px 2px 16px}.cards{display:grid;grid-template-columns:1fr;gap:14px}.card{display:flex;flex-direction:column;min-width:0;background:white;border:1px solid var(--line);border-radius:16px;padding:17px;box-shadow:0 3px 12px #19365308}.tag{align-self:flex-start;display:inline-block;background:#eaf2fa;color:#1e527e;border-radius:999px;padding:5px 9px;font-size:.78rem;font-weight:750;margin-bottom:9px}.card h2{font-size:1.08rem;line-height:1.35;margin:0 0 10px;overflow-wrap:anywhere}.meta{display:flex;gap:8px;align-items:flex-start;font-size:.9rem;color:var(--muted);line-height:1.45;margin:3px 0 14px;min-height:2.6em;overflow-wrap:anywhere}.pin{flex:0 0 auto}.actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:auto}.actions a,.actions .disabled{display:flex;align-items:center;justify-content:center;text-align:center;min-height:42px;padding:8px 5px;border-radius:9px;font-size:.82rem;line-height:1.15;font-weight:750;text-decoration:none;overflow-wrap:anywhere}.actions a{background:var(--navy);color:#fff}.actions a:hover{background:var(--blue)}.actions .disabled{background:#edf1f5;color:#8793a1;cursor:not-allowed}.profile{display:flex;align-items:center;justify-content:center;text-align:center;margin-top:9px;min-height:40px;border:1px solid #cbd8e6;border-radius:9px;color:var(--navy);background:#f7f9fc;text-decoration:none;font-size:.88rem;font-weight:750;padding:8px}.note{font-size:.78rem;color:#7a5a1a;line-height:1.4;margin-top:10px;min-height:1.1em}.note:empty{display:none}.empty{padding:30px;text-align:center;color:var(--muted);background:white;border-radius:14px}footer{text-align:center;color:var(--muted);font-size:.85rem;padding:0 16px 28px}footer a{color:var(--blue)}
@media(min-width:620px){.filters{grid-template-columns:2fr 1fr}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(min-width:950px){.cards{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style></head>
<body><header><div class="wrap"><div class="top"><div class="brand">Bridge<span>Turkey</span></div><button class="lang" id="lang" aria-label="Change language">EN</button></div><h1 id="headline">Türk firmalarını keşfedin</h1><p id="subtitle">Arayın, sektörlere göre filtreleyin ve firmalarla bağlantı kurun.</p></div></header>
<main class="wrap"><div class="filters"><input id="q" type="search" placeholder="Firma, ürün veya şehir ara…"><select id="sector"><option value="">Tüm sektörler</option></select></div><div class="count" id="count"></div><div class="cards" id="cards"></div></main>
<footer><p id="footnote">Firma bilgileri ilgili şirket kaynaklarından kontrol edilmelidir.</p><a href="https://bridgeturkey.rs/firme/" target="_blank" rel="noopener">BridgeTurkey web sitesi</a></footer>
<script>
const LANGS={
tr:{headline:"Türk firmalarını keşfedin",subtitle:"Arayın, sektörlere göre filtreleyin ve firmalarla bağlantı kurun.",search:"Firma, ürün veya şehir ara…",all:"Tüm sektörler",count:n=>`${n} firma gösteriliyor`,location:"Konum bilgisi henüz eklenmedi.",review:"İletişim bilgilerinden bazıları henüz eklenmedi veya doğrulanmadı.",footnote:"Firma bilgileri ilgili şirket kaynaklarından kontrol edilmelidir.",empty:"Eşleşen firma bulunamadı.",call:"Ara",email:"E-posta",website:"Web sitesi",profile:"BridgeTurkey profili",missingCall:"Telefon yok",missingEmail:"E-posta yok",missingWebsite:"Web sitesi yok"},
en:{headline:"Discover Turkish companies",subtitle:"Search, filter by industry and connect with companies.",search:"Search company, product or city…",all:"All industries",count:n=>`Showing ${n} companies`,location:"Location not added yet.",review:"Some contact details are missing or not yet verified.",footnote:"Company details should be checked against the relevant company sources.",empty:"No matching companies found.",call:"Call",email:"Email",website:"Website",profile:"BridgeTurkey profile",missingCall:"No phone",missingEmail:"No email",missingWebsite:"No website"},
sr:{headline:"Otkrijte turske kompanije",subtitle:"Pretražujte, filtrirajte po sektoru i povežite se sa kompanijama.",search:"Pretražite kompaniju, proizvod ili grad…",all:"Svi sektori",count:n=>`Prikazano kompanija: ${n}`,location:"Lokacija još nije dodata.",review:"Neki kontakt podaci nedostaju ili još nisu provereni.",footnote:"Podatke o kompanijama treba proveriti na odgovarajućim izvorima.",empty:"Nema pronađenih kompanija.",call:"Pozovi",email:"E-pošta",website:"Veb-sajt",profile:"BridgeTurkey profil",missingCall:"Nema telefona",missingEmail:"Nema e-pošte",missingWebsite:"Nema sajta"}
};
let lang="tr",firms=[];const $=id=>document.getElementById(id);function tx(){return LANGS[lang]}
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function safeUrl(s){try{const u=new URL(s);return ["http:","https:"].includes(u.protocol)?u.href:""}catch{return ""}}
function action(href,label,active){return active?`<a href="${esc(href)}" ${href.startsWith("http")?`target="_blank" rel="noopener noreferrer"`:""}>${esc(label)}</a>`:`<span class="disabled" aria-disabled="true" title="${esc(label)}">${esc(label)}</span>`}
function populateSectors(){const vals=[...new Set(firms.map(f=>lang==="tr"?f.sector:f.sector_en).filter(Boolean))].sort();const old=$("sector").value;$("sector").innerHTML=`<option value="">${tx().all}</option>`+vals.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join("");if(vals.includes(old))$("sector").value=old}
function render(){const t=tx(),q=$("q").value.toLocaleLowerCase(lang==="tr"?"tr":"en"),s=$("sector").value;const arr=firms.filter(f=>(!s||(lang==="tr"?f.sector:f.sector_en)===s)&&[f.name,f.sector,f.sector_en,f.location].join(" ").toLocaleLowerCase(lang==="tr"?"tr":"en").includes(q));$("count").textContent=t.count(arr.length);$("cards").innerHTML=arr.length?arr.map(f=>{const phone=String(f.phone||"").trim(),email=String(f.email||"").trim(),website=safeUrl(String(f.website||"").trim()),profile=safeUrl(String(f.profile||"").trim());const missing=[];if(!phone)missing.push(t.missingCall);if(!email)missing.push(t.missingEmail);if(!website)missing.push(t.missingWebsite);return `<article class="card"><div class="tag">${esc(lang==="tr"?f.sector:f.sector_en)||esc(f.sector)||"—"}</div><h2>${esc(f.name)}</h2><div class="meta"><span class="pin">📍</span><span>${esc(f.location||t.location)}</span></div><div class="actions">${action(phone?`tel:${phone.replace(/[^+\d]/g,"")}` ,phone?t.call:t.missingCall,!!phone)}${action(email?`mailto:${email}`:"",email?t.email:t.missingEmail,!!email)}${action(website,website?t.website:t.missingWebsite,!!website)}</div>${profile?`<a class="profile" href="${esc(profile)}" target="_blank" rel="noopener noreferrer">${t.profile}</a>`:`<span class="profile">${t.profile}</span>`}<div class="note">${missing.length?esc(t.review):""}</div></article>`}).join(""):`<div class="empty">${t.empty}</div>`;$("headline").textContent=t.headline;$("subtitle").textContent=t.subtitle;$("q").placeholder=t.search;$("footnote").textContent=t.footnote}
$("q").addEventListener("input",render);$("sector").addEventListener("change",render);$("lang").addEventListener("click",()=>{lang=lang==="tr"?"en":lang==="en"?"sr":"tr";document.documentElement.lang=lang;$("lang").textContent=lang==="tr"?"EN":lang==="en"?"SR":"TR";populateSectors();render()});
fetch("firms.json").then(r=>{if(!r.ok)throw Error("load");return r.json()}).then(d=>{firms=Array.isArray(d)?d:[];populateSectors();render()}).catch(()=>{$("cards").innerHTML='<div class="empty">Firma listesi yüklenemedi. firms.json dosyasını kontrol edin.</div>'});if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
